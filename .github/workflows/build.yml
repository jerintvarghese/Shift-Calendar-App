name: Build Android app

# Builds the Shift Calendar APK from the live website and publishes it as a release.
# Runs on every change to this repository, or on demand from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE: https://jerintvarghese.github.io/Shift-Calendar
      VERSION_CODE: ${{ github.run_number }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'shiftcalendar' }}
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create the Android project
        run: |
          set -e
          PKG=app/src/main/java/ie/shiftcalendar
          RES=app/src/main/res
          mkdir -p $PKG app/src/main/assets $RES/values $RES/mipmap-anydpi-v26

          # The app itself: the latest calendar page from the website, bundled so it works offline
          curl -fsSL "$SITE/index.html" -o app/src/main/assets/index.html
          curl -fsSL "$SITE/logo-512.png" -o logo.png

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "ShiftCalendar"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          def vc = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
          android {
            namespace 'ie.shiftcalendar'
            compileSdk 34
            defaultConfig {
              applicationId 'ie.shiftcalendar.app'
              minSdk 24
              targetSdk 34
              versionCode vc
              versionName "1.0." + vc
            }
            signingConfigs {
              release {
                storeFile file('release.jks')
                storePassword System.getenv('KS_PASS')
                keyAlias 'shifts'
                keyPassword System.getenv('KS_PASS')
              }
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.release
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:label="Shifts"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:theme="@style/AppTheme"
                android:allowBackup="true">
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > $RES/values/themes.xml <<'EOF'
          <resources>
            <color name="bg">#ECEFF2</color>
            <color name="icon_bg">#262D6E</color>
            <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
              <item name="android:statusBarColor">#2C336E</item>
              <item name="android:windowBackground">@color/bg</item>
            </style>
          </resources>
          EOF

          cat > $RES/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/icon_bg" />
            <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > $PKG/MainActivity.java <<'EOF'
          package ie.shiftcalendar;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
            private static final String HOST = "appassets.androidplatform.net";
            private WebView web;

            @Override
            protected void onCreate(Bundle state) {
              super.onCreate(state);
              web = new WebView(this);
              setContentView(web);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                  .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                  .build();
              web.setWebViewClient(new WebViewClient() {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  return loader.shouldInterceptRequest(r.getUrl());
                }
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if (HOST.equals(u.getHost())) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                  return true;
                }
              });
              if (state != null) web.restoreState(state);
              else web.loadUrl("https://" + HOST + "/assets/index.html");
            }

            @Override
            protected void onSaveInstanceState(Bundle out) {
              super.onSaveInstanceState(out);
              web.saveState(out);
            }

            @Override
            public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF

      - name: Make the app icons
        run: |
          pip install --quiet pillow
          python3 - <<'EOF'
          from PIL import Image
          import os
          src = Image.open("logo.png").convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, px in sizes.items():
              out = f"app/src/main/res/mipmap-{d}"
              os.makedirs(out, exist_ok=True)
              src.resize((px, px), Image.LANCZOS).save(f"{out}/ic_launcher.png")
              fg = round(px * 108 / 48)
              src.resize((fg, fg), Image.LANCZOS).save(f"{out}/ic_launcher_foreground.png")
          EOF

      - name: Prepare the signing key
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/release.jks
          else
            keytool -genkeypair -keystore app/release.jks -alias shifts -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Shift Calendar"
          fi

      - name: Build the APK
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Shifts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Shifts-apk
          path: Shifts.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Shift Calendar 1.0.${{ github.run_number }}
          body: |
            Download **Shifts.apk** below and open it on your Android phone to install.
            Built from ${{ env.SITE }}
          files: Shifts.apk
          make_latest: true
